name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-core-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --constraint requirements/ci.constraints \
            -e '.[test,qwen]'
      - name: Lint
        run: python -m ruff check src tools spikes tests
      - name: Run default CPU suite
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: |
          junit_report="$RUNNER_TEMP/complete-cpu-pytest.xml"
          set +e
          env -u OPENROUTER_API_KEY python -m pytest -q \
            --junitxml "$junit_report"
          pytest_status=$?
          set -e
          if [[ "$pytest_status" -ne 0 ]]; then
            python .github/scripts/emit_ci_pytest_annotations.py "$junit_report"
          fi
          exit "$pytest_status"

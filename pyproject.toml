[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tgvf-e2e-rl"
version = "0.1.0"
description = "Exact-replay framework for TGVF end-to-end reinforcement learning"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch>=2.4",
]

[project.scripts]
tgvf-rl = "tgvf_rl.cli:main"

[project.entry-points."vllm.general_plugins"]
tgvf_qwen3_precomputed = "tgvf_rl.framework.vllm:register_tgvf_qwen3_vllm_plugin"

[project.optional-dependencies]
qwen = [
  "numpy>=1.26",
  "Pillow>=10.0",
  "safetensors>=0.4",
  "transformers>=4.57",
]
test = [
  "aiohttp>=3.9",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "pandas>=2.2",
  "pytest>=8.3",
  "ruff==0.15.22",
  "tensordict>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Historical launch-security/control-plane suites and the dedicated CUDA parity
# probe remain opt-in maintenance targets rather than default source gates.
addopts = """
-ra
--import-mode=importlib
--ignore=tests/config/test_cli_execution_authorization.py
--ignore=tests/framework/test_qwen3_flex_attention_cuda.py
--ignore=tests/ops/test_child_environment.py
--ignore=tests/ops/test_ci_boundary_ratchet.py
--ignore=tests/ops/test_cli_authorization.py
--ignore=tests/ops/test_fd_bound_python_exec.py
--ignore=tests/ops/test_fd_bound_python_exec_security.py
--ignore=tests/ops/test_launch_control_static.py
--ignore=tests/ops/test_launch_gate.py
--ignore=tests/ops/test_representation_child_environment_integration.py
--ignore=tests/ops/test_representation_member_consumption.py
--ignore=tests/ops/test_representation_member_selection.py
--ignore=tests/ops/test_representation_startup.py
--ignore=tests/ops/test_runtime_locator.py
--ignore=tests/ops/test_sealed_memfd_artifact.py
--ignore=tests/ops/test_worker_bootstrap.py
--ignore=tests/ops/test_worker_startup.py
--ignore=tests/policy/test_launch_startup_authorization.py
"""
testpaths = ["tests"]
pythonpath = ["src"]

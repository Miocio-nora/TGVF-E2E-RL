schema_version = "representation-training-config-v5"
scope = "qwen3_native_representation_phase_training"
run_id = "RP-72-QWEN3-INSTRUCT-REP-NO-DEEPSTACK-BASE-2000-GPU23"

[code]
repository = "Miocio-nora/TGVF-E2E-RL"
commit = "e8ff02d47af540c22c7ab660c6c1fdb5c5d0692c"
dirty = false
dirty_state_sha256 = "none"

[model]
family = "qwen3_vl"
model_name = "Qwen3-VL-8B-Instruct"
local_path = "/nvmesv/dredvpn009/models/hf/Qwen3-VL-8B-Instruct"
tokenizer_length = 151669
chat_template_sha256 = "3636d0f0bd6bef02654cdffdc447b79cb2cef8ab02cc75267345946291a489e4"
dtype = "bfloat16"
attention_backend = "sdpa"
local_files_only = true
trust_remote_code = false
tokenizer_resize = false
image_max_pixels = 262144

[adapter]
variant = "main_d_only"

[conditioning]
provider = "contextual_hidden_state"
hidden_layer = -1

[data]
warn_on_target_leakage = false
split_overlap_policy = "allow_recorded_image_path"
expected_overlap_report_sha256 = "3cad19a9d0e359ea368071082092f431349859a7520bc03a39cce6e90dffdc27"

[data.train]
jsonl_path = "/nvmesv/dredvpn009/projects/r-vlm/revisit_vlm/data/tgvf_teacher/generated/runs/tgvf_v4_teacher_50k_clean_imend/splits/tgvf_v4_teacher_stage1_protocol_c_focus.train.jsonl"
source_sha256 = "c94a38b824b6603e555eed5ef3584c19cc903b76995d49c67ace36b18268443c"
batch_size = 4
sampler_seed = 42

[data.validation]
jsonl_path = "/nvmesv/dredvpn009/projects/r-vlm/revisit_vlm/data/tgvf_teacher/generated/runs/tgvf_v4_teacher_50k_clean_imend/splits/tgvf_v4_teacher_stage1_protocol_c_focus.test.jsonl"
source_sha256 = "de61c731eb961825a77df587cd76c00eabfea75b5c6003096f3cc7f1a51dd82d"
batch_size = 4
sampler_seed = 42

[prompt]
schema_version = "native_representation_prompt_v1"
identity = "qwen3-representation-image-question-v1"
template = "{question}"
sha256 = "bf085a6e12c9d0e23a9dd157df084f933b2ef021caba82def1494bfb84a723c9"

[objective]
identity = "main-d-only-balanced-matrix-ce-l-gen-norm-ablation-v1"
kind = "matrix_ce_l_gen_and_norm"
matrix_ce_weight = 1.0
l_gen_weight = 1.0
norm_weight = 0.1
matrix_ce_mode = "balanced"
matrix_ce_temperature = 1.0
manifold_enabled = false
manifold_weight = 0.0

[optimizer]
type = "adamw"
learning_rate = 0.0001
betas = [0.9, 0.999]
eps = 0.00000001
weight_decay = 0.01
amsgrad = false
maximize = false
foreach = false
capturable = false
differentiable = false
fused = false
decoupled_weight_decay = true

[scheduler]
kind = "historical_cosine"
total_steps = 2000
warmup_steps = 100
min_lr_ratio = 0.1

[execution]
precision = "bf16"
max_grad_norm = 1.0
require_all_adapter_gradients = true
gradient_clip_norm_type = 2.0
gradient_clip_error_if_nonfinite = true

[initialization]
kind = "fresh_random"
seed = 42
source_artifact_sha256 = "none"
allow_legacy_checkpoint_initialization = false

[fsdp2]
strategy = "fsdp2"
world_size = 2
physical_gpu_ids = [2, 3]
logical_gpu_ids = [0, 1]
device_type = "cuda"
mesh_dim_name = "fsdp"
mesh_shape = [2]
reshard_after_forward = false
parameter_dtype = "bfloat16"
reduce_dtype = "float32"
output_dtype = "bfloat16"
cast_forward_inputs = true
offload_policy = "none"

[training]
gradient_accumulation_steps = 4
groups_per_rank_per_optimizer_step = 1
target_optimizer_steps = 2000
validation_every_optimizer_steps = 2000
log_every_optimizer_steps = 10

[post_training_internal_evaluation]
enabled = false

[output]
final_artifact_path = "/nvmesv/dredvpn009/projects/r-vlm/tgvf-e2e-rl/artifacts/representation/RP-72-no-deepstack-base-unused/adapter.pt"
metrics_jsonl_path = "/nvmesv/dredvpn009/projects/r-vlm/tgvf-e2e-rl/artifacts/representation/RP-72-no-deepstack-base-unused/metrics.jsonl"
allow_overwrite = false

[resume]
enabled = false
checkpoint_path = "none"
strict_identity = true

[checkpoint]
directory = "/nvmesv/dredvpn009/projects/r-vlm/tgvf-e2e-rl/artifacts/representation/RP-72-no-deepstack-base-unused/checkpoints"
filename_prefix = "representation-rp72-no-deepstack-base-unused"
save_every_optimizer_steps = 500
save_final = true
keep_last = 4
strict_identity = true
optimizer_boundary_only = true
format = "distributed-representation-checkpoint-v2"

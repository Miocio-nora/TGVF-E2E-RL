schema_version = "representation-training-config-v1"
scope = "qwen3_native_representation_phase_training"
run_id = "SC-40-QWEN3-REPRESENTATION-FSDP2-EMBEDDING"

[code]
repository = "Miocio-nora/TGVF-E2E-RL"
commit = "ce6a15f5e7df6fabf57f0997cee279efb66a96e4"
dirty = false
dirty_state_sha256 = "none"

[model]
family = "qwen3_vl"
model_name = "Qwen3-VL-8B-Thinking"
local_path = "/nvmesv/dredvpn009/models/hf/Qwen3-VL-8B-Thinking"
tokenizer_length = 151669
chat_template_sha256 = "36e042fe45641f067b1f2381fcc8955d10d956a3ed333ecdf7f7eb0916f68956"
dtype = "bfloat16"
attention_backend = "sdpa"
local_files_only = true
trust_remote_code = false
tokenizer_resize = false

[conditioning]
provider = "target_token_embedding"
embedding_identity = "/nvmesv/dredvpn009/models/hf/Qwen3-VL-8B-Thinking::language_model.input_embeddings"

[data]
warn_on_target_leakage = true
require_disjoint_validation = true

[data.train]
jsonl_path = "/nvmesv/dredvpn009/projects/r-vlm/tgvf-e2e-rl/tests/fixtures/representation_smoke/train.jsonl"
source_sha256 = "e939cd96278b6651349c18eea056ee52c1903a9fae1cb11e1a53e3061305bef3"
batch_size = 2
sampler_seed = 71

[data.validation]
jsonl_path = "/nvmesv/dredvpn009/projects/r-vlm/tgvf-e2e-rl/tests/fixtures/representation_smoke/validation.jsonl"
source_sha256 = "e483640c9799b02e4eaaccffe37f02cc9434198ed576c64a10d491251cc514f9"
batch_size = 2
sampler_seed = 73

[prompt]
identity = "qwen3-representation-smoke-only-v1"
template = "[SMOKE-ONLY REPRESENTATION FIXTURE; NOT A PRODUCTION PROMPT]\nQuestion: {question}\nRequested target: {target}\nUse the native focus tool once for that target."
sha256 = "ea2fb166448a2fb7af33017da635d85fe717265987e4c7073b588c443670ffd3"

[objective]
identity = "matrix-ce-plus-l-gen-smoke-only-v1"
kind = "matrix_ce_and_l_gen"
matrix_ce_weight = 1.0
l_gen_weight = 0.25
manifold_enabled = false
manifold_weight = 0.0
norm_loss = "unset_not_implemented"

[optimizer]
type = "adamw"
learning_rate = 0.0003
betas = [0.9, 0.999]
eps = 0.00000001
weight_decay = 0.01
amsgrad = false
maximize = false
foreach = false
capturable = false
differentiable = false
fused = false
decoupled_weight_decay = true

[scheduler]
kind = "constant"
total_steps = 1
warmup_steps = 0

[execution]
precision = "bf16"
max_grad_norm = 1.0
require_all_adapter_gradients = true
gradient_clip_norm_type = 2.0
gradient_clip_error_if_nonfinite = true

[initialization]
kind = "fresh_random"
seed = 20260719
source_artifact_sha256 = "none"
allow_legacy_checkpoint_initialization = false

[fsdp2]
strategy = "fsdp2"
world_size = 2
physical_gpu_ids = [2, 3]
logical_gpu_ids = [0, 1]
device_type = "cuda"
mesh_dim_name = "fsdp"
mesh_shape = [2]
reshard_after_forward = true
parameter_dtype = "bfloat16"
reduce_dtype = "float32"
output_dtype = "bfloat16"
cast_forward_inputs = true
offload_policy = "none"

[training]
gradient_accumulation_steps = 1
target_optimizer_steps = 1
validation_every_optimizer_steps = 1
log_every_optimizer_steps = 1

[output]
final_artifact_path = "/nvmesv/dredvpn009/projects/r-vlm/tgvf-e2e-rl/artifacts/representation/SC-40-qwen3-representation-fsdp2-embedding/adapter.pt"
metrics_jsonl_path = "/nvmesv/dredvpn009/projects/r-vlm/tgvf-e2e-rl/artifacts/representation/SC-40-qwen3-representation-fsdp2-embedding/metrics.jsonl"
allow_overwrite = false

[resume]
enabled = false
checkpoint_path = "none"
strict_identity = true

[checkpoint]
directory = "/nvmesv/dredvpn009/projects/r-vlm/tgvf-e2e-rl/artifacts/representation/SC-40-qwen3-representation-fsdp2-embedding/checkpoints"
filename_prefix = "representation-qwen3-embedding"
save_every_optimizer_steps = 1
save_final = true
keep_last = 1
strict_identity = true
optimizer_boundary_only = true
format = "distributed-representation-checkpoint-v1"

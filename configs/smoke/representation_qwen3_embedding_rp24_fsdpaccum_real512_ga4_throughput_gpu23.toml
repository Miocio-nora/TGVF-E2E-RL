schema_version = "representation-training-config-v2"
scope = "qwen3_native_representation_phase_training"
run_id = "RP-24-QWEN3-REPRESENTATION-FSDPACCUM-REAL512-K4-GA4-THROUGHPUT-GPU23"

[code]
repository = "Miocio-nora/TGVF-E2E-RL"
commit = "ac13f568061ca893400d343b9ebc9419127e2195"
dirty = false
dirty_state_sha256 = "none"

[model]
family = "qwen3_vl"

[data.train]
jsonl_path = "/nvmesv/dredvpn009/projects/r-vlm/tgvf-e2e-rl/tests/fixtures/representation_smoke/train_k4_real_resolution_ab.jsonl"
source_sha256 = "7351cdcd81adf8861ed867144c27e2faa67587f3b31531fa54658cf54134800d"
batch_size = 4
sampler_seed = 71

[data.validation]
jsonl_path = "/nvmesv/dredvpn009/projects/r-vlm/tgvf-e2e-rl/tests/fixtures/representation_smoke/validation_k4.jsonl"
source_sha256 = "5a0ab5148d75d6b3df5c7c4e3ee61a5d824ddf2b82df6474769af730f6db4d12"
batch_size = 4
sampler_seed = 73

[prompt]
identity = "qwen3-representation-smoke-only-v1"
template = "[SMOKE-ONLY REPRESENTATION FIXTURE; NOT A PRODUCTION PROMPT]\nQuestion: {question}\nRequested target: {target}\nUse the native focus tool once for that target."
sha256 = "ea2fb166448a2fb7af33017da635d85fe717265987e4c7073b588c443670ffd3"

[objective]
identity = "matrix-ce-l-gen-norm-rpi-20260719-smoke-v1"
kind = "matrix_ce_l_gen_and_norm"
matrix_ce_weight = 1.0
l_gen_weight = 1.0
norm_weight = 0.1
manifold_enabled = false
manifold_weight = 0.0

[optimizer]
type = "adamw"
learning_rate = 0.0001
betas = [0.9, 0.999]
eps = 0.00000001
weight_decay = 0.01
amsgrad = false
maximize = false
foreach = false
capturable = false
differentiable = false
fused = false
decoupled_weight_decay = true

[scheduler]
kind = "historical_cosine"
total_steps = 2000
warmup_steps = 100
min_lr_ratio = 0.1

[execution]
precision = "bf16"
max_grad_norm = 1.0
require_all_adapter_gradients = true
gradient_clip_norm_type = 2.0
gradient_clip_error_if_nonfinite = true

[initialization]
kind = "fresh_random"
seed = 20260719
source_artifact_sha256 = "none"
allow_legacy_checkpoint_initialization = false

[fsdp2]
strategy = "fsdp2"
world_size = 2
physical_gpu_ids = [2, 3]
logical_gpu_ids = [0, 1]
device_type = "cuda"
mesh_dim_name = "fsdp"
mesh_shape = [2]
reshard_after_forward = false
parameter_dtype = "bfloat16"
reduce_dtype = "float32"
output_dtype = "bfloat16"
cast_forward_inputs = true
offload_policy = "none"

[training]
gradient_accumulation_steps = 4
groups_per_rank_per_optimizer_step = 1
target_optimizer_steps = 3
validation_every_optimizer_steps = 4
log_every_optimizer_steps = 1

[output]
final_artifact_path = "/nvmesv/dredvpn009/projects/r-vlm/tgvf-e2e-rl/artifacts/representation/RP-24-qwen3-fsdpaccum-real512-k4-ga4-throughput-gpu23/adapter.pt"
metrics_jsonl_path = "/nvmesv/dredvpn009/projects/r-vlm/tgvf-e2e-rl/artifacts/representation/RP-24-qwen3-fsdpaccum-real512-k4-ga4-throughput-gpu23/metrics.jsonl"
allow_overwrite = false

[resume]
enabled = false
checkpoint_path = "none"
strict_identity = true

[checkpoint]
directory = "/nvmesv/dredvpn009/projects/r-vlm/tgvf-e2e-rl/artifacts/representation/RP-24-qwen3-fsdpaccum-real512-k4-ga4-throughput-gpu23/checkpoints"
filename_prefix = "representation-qwen3-fsdpaccum-real512-k4-ga4-throughput-gpu23"
save_every_optimizer_steps = 4
save_final = true
keep_last = 1
strict_identity = true
optimizer_boundary_only = true
format = "distributed-representation-checkpoint-v2"

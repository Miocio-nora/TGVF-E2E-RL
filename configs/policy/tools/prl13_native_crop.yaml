tools:
  - class_name: tgvf_rl.framework.verl.native_crop_tool.NativeDeepEyesCropTool
    config:
      type: native
      max_crops: 6
    tool_schema:
      type: function
      function:
        name: image_zoom_in_tool
        description: >-
          Zoom in on a specific region of an image by cropping it based on a
          bounding box (bbox) and an optional object label.
        parameters:
          type: object
          properties:
            bbox_2d:
              type: array
              items:
                type: number
              minItems: 4
              maxItems: 4
              description: >-
                Qwen model-facing relative bounding box [x1, y1, x2, y2] in
                the 0..1000 coordinate space. Runtime maps it exactly once to
                immutable source pixels.
            label:
              type: string
              description: Optional name or label of the cropped object.
          required:
            - bbox_2d
          additionalProperties: false
